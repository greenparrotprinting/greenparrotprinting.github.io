<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Griffin Miller â Green Parrot Printing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141414;
    --green:#A1D004;
    --blue:#0084EC;
    --yellow:#FDD702;
    --magenta:#FB1A7F;
    --paper:#F7F7F5;
    --slate:#6B6B68;
    --white:#FFFFFF;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{ position:relative; }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background-image:url('synthwave-bg.png');
    background-repeat:no-repeat;
    background-size:cover;
    background-position:center;
  }

  body{
    background:var(--paper);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .card{
    width:100%;
    background:var(--white);
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 24px 48px -16px rgba(20,20,20,0.22), 0 8px 20px -8px rgba(20,20,20,0.14);
  }

  .logo-area{
    padding:32px 32px 20px;
    display:flex;
    justify-content:center;
  }
  .logo-area img{
    width:150px;
    height:auto;
    display:block;
  }

  .colorbar{
    display:flex;
    height:8px;
  }
  .colorbar span{ flex:1; }
  .colorbar .c1{ background:var(--magenta); }
  .colorbar .c2{ background:var(--blue); }
  .colorbar .c3{ background:var(--yellow); }
  .colorbar .c4{ background:var(--green); }

  .content{
    padding:24px 28px 26px;
    position:relative;
  }

  .name-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:4px;
  }

  .photo-circle{
    width:64px;
    height:64px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--magenta);
    flex-shrink:0;
    box-shadow:0 6px 14px -6px rgba(20,20,20,0.35);
  }
  .photo-circle img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .name{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:24px;
    line-height:1.1;
    color:var(--ink);
  }

  .title-pill{
    display:block;
    margin-top:4px;
    color:var(--magenta);
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }

  .tagline{
    margin-top:16px;
    font-size:13.5px;
    color:var(--slate);
    line-height:1.5;
    padding-bottom:16px;
    border-bottom:1px solid #ECECE8;
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding:11px 0;
    text-decoration:none;
    color:var(--ink);
  }
  .row .icon{
    width:36px;
    height:36px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .row:nth-of-type(1) .icon{ background:var(--blue); }
  .row:nth-of-type(2) .icon{ background:var(--magenta); }
  .row:nth-of-type(3) .icon{ background:var(--green); }
  .row .icon svg{ width:16px; height:16px; }
  .row .text .main{
    font-size:14.5px;
    font-weight:500;
  }
  .row .text .sub{
    font-size:11.5px;
    color:var(--slate);
    margin-top:1px;
  }

  .save-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    margin-top:18px;
    padding:15px 20px;
    background:var(--green);
    color:var(--ink);
    border:none;
    border-radius:100px;
    font-family:'Poppins', sans-serif;
    font-size:13.5px;
    font-weight:700;
    letter-spacing:0.04em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 12px 22px -10px rgba(161,208,4,0.6);
    transition:background 0.15s ease, transform 0.1s ease;
  }
  .save-btn:hover{ background:#8FBC03; }
  .save-btn:active{ transform:translateY(1px); }
  .save-btn:focus-visible{ outline:3px solid var(--magenta); outline-offset:2px; }
  .save-btn svg{ width:15px; height:15px; }

  .footer-note{
    margin-top:14px;
    text-align:center;
    font-size:12px;
    color:var(--slate);
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="logo-area"><img src="logo.png" alt="Green Parrot Printing"></div>

      <div class="colorbar">
        <span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span>
      </div>

      <div class="content">
        <div class="name-row">
          <div class="photo-circle">
            <img src="griffin-headshot.jpg" alt="Griffin Miller">
          </div>
          <div>
            <div class="name">Griffin Miller</div>
            <div class="title-pill">President</div>
          </div>
        </div>

        <div class="tagline">Bringing your brand to life, one print at a time.</div>

        <a class="row" href="tel:7274333449">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </span>
          <span class="text">
            <div class="main">727-433-3449</div>
            <div class="sub">mobile</div>
          </span>
        </a>

        <a class="row" href="mailto:griffin@greenparrotprinting.com">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
          </span>
          <span class="text">
            <div class="main">griffin@greenparrotprinting.com</div>
            <div class="sub">email</div>
          </span>
        </a>

        <a class="row" href="https://www.greenparrotprinting.com" target="_blank">
          <span class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </span>
          <span class="text">
            <div class="main">greenparrotprinting.com</div>
            <div class="sub">website</div>
          </span>
        </a>

        <a class="save-btn" href="griffin-miller.vcf" download="Griffin-Miller.vcf">
          <svg viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save Contact
        </a>
      </div>
    </div>
    <div class="footer-note">Adds Griffin to your phone's contacts</div>
  </div>

</body>
</html>
